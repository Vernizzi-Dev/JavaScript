<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando eventos DOM</title>
    <style>
        .interaja{
            width: 300px;
            height: 200px;
            background-color: rgb(255, 224, 177);
            font-size: 6vw;
            border-radius: 3vw;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.538);
            cursor: pointer;
            text-align: center;
            line-height: 200px;
            text-shadow: 0px 0px 20px rgba(0, 0, 0, 0.741);
            color: rgb(208, 124, 34);
            margin: auto;
        }
        h1{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 50px;
        }
        h2{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 50px; 
        }
        .viado{
            display: none;
            width: 200px;
            height: 150px;
            border-radius: 2vw;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.538);
            margin: auto;
            font-size: 5vw;
            text-align: center;
            line-height: 150px;
            text-shadow: 0px 0px 20px rgba(0, 0, 0, 0.741);
        }
    </style>
</head>
<body>
    <h1>Interaja com o meu Site!</h1>

    <div class="interaja" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">😎</div>

    <h2></h2>

    <div class="viado"></div>


    <script>
        let inte = document.querySelector('div.interaja')
        let h1 = document.getElementsByTagName('h1')[0]
        let h2 = document.getElementsByTagName('h2')[0]
        let viado = document.querySelector('div.viado')

        function entrar(){
            inte.innerHTML = '🤔'
            inte.style.background = 'rgb(255, 164, 67)'
            h1.innerText = 'O que você está fazendo??'
            h1.style.color = ' rgb(208, 124, 34)'
            h2.innerText = ''
             viado.style.display =  'none'
        }

        function clicar(){
            inte.innerHTML = '😫'
            inte.style.background = 'rgb(203, 65, 63)'
            h1.innerText = 'HaaaWnnnm...!!!'
            h1.style.color = 'rgb(203, 65, 63)'
            h2.innerText = 'Tá Maluco irmão?!!'
            h2.style.color = 'rgb(203, 65, 63)'
            viado.style.display =  'block'
            viado.style.background = ' rgb(234, 104, 102)'
            viado.innerText = '🤬'
        }

        function sair(){
            inte.innerHTML = '😎'
            inte.style.background = 'rgb(255, 224, 177)'
            h1.innerText = 'Interaja com o meu Site!'
            h1.style.color = 'black'
            h2.innerText = ''
             viado.style.display =  'none'
        }
    </script>
</body>
</html>
