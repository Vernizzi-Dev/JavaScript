<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript</title>
    <style>
      body {
        font: normal 35pt Arial;
        background-image: linear-gradient(90deg, rgb(255, 255, 255), rgb(40, 40, 40));
      }
    </style>
  </head>
  <body>
    <script>
      let nome = prompt("Digite o seu primeiro nome:");
      document.write(`Olá, ${nome}! Seu nome contém ${nome.length} letras! <br/> <br/> `);
      document.write(`Seu nome em letras maiúsculas é ${nome.toUpperCase()}   <br/> <br/>` )
      document.write(`Já em minúsculas é  ${nome.toLowerCase()}`)
    </script>
  </body>
</html>
